<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove char</title>
</head>
<body>
    <script>
        let str1 = prompt("Enter the string:");
let str2 = "";
let n = str1.length;

for (let i = 0; i < n; i++) {
  if (str1[i] >= '0' && str1[i] <= '9') {
    str2 += str1[i];
  }
}

console.log("String without alphabets: " + str2);
alert("String without alphabets: " + str2);

        

    </script>
</body>
</html>
